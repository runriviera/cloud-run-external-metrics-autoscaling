name: Riviera metric provider CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: riviera-metric-provider-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metric-provider:
    name: Metric provider tests, race detector, and vet
    if: github.repository == 'runriviera/cloud-run-external-metrics-autoscaling'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
    defaults:
      run:
        working-directory: metric-provider
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: metric-provider/go.mod
          cache: false

      - name: Install protocol compiler and generators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

      - name: Generate protocol bindings
        working-directory: .
        run: protoc --proto_path=. --proto_path=/usr/include --go_out=. --go-grpc_out=. proto/*.proto

      - name: Run metric provider tests
        run: go test -count=1 -timeout=15m ./...

      - name: Run metric provider race tests
        run: go test -race -count=1 -timeout=15m ./...

      - name: Run metric provider static analysis
        run: go vet ./...
